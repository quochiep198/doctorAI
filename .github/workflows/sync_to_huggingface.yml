name: Sync to Hugging Face Spaces

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  sync-to-hub:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Push to Hugging Face Spaces
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          rm -rf .git
          git init
          git config user.name "GitHub Actions"
          git config user.email "github-actions@github.com"
          rm -rf assets/
          git add .
          git commit -m "deploy: initial clean deployment to Hugging Face"
          git branch -m main
          git push --force https://quochiepho:$HF_TOKEN@huggingface.co/spaces/quochiepho/trader main
